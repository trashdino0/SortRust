[package]
name = "sort-core"
version = "0.1.0"
edition = "2021"
description = "Sorting algorithm ports: Java FastRadixSort + Python numba suite (insertion, bucket, quick, merge, radix, parallel radix, timsort)"
license = "MIT"

[dependencies]
rayon = "1"
thiserror = "2"

[dev-dependencies]
rand = "0.8"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "sorting"
harness = false
